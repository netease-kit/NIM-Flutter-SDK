<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Demonstrates how to use the flutter_plugin plugin."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="flutter_plugin_example" />
    <title>nim_core_web</title>
    <script>
      // The value below is injected by flutter build, do not touch.
      var serviceWorkerVersion = null;
    </script>
    <script src="flutter.js"></script>
</head>
  <body>
    <!-- NIM Web SDK (UMD 格式，导出全局 NIM 对象) -->
    <!-- nim-web-sdk-ng v10.9.80 -->
    <!-- 通过 web/download_nim_sdk.sh 预下载到本地，构建前执行一次即可 -->
    <script src="NIM_BROWSER_SDK.js"></script>
    <!-- AWS S3 SDK (如果存储功能需要) -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.410.0.min.js"></script>
    <script>
      window.s3 = AWS.S3
      window.onload = function () {
        try {
          _flutter.loader
            .loadEntrypoint({
              serviceWorker: {
                serviceWorkerVersion: serviceWorkerVersion,
              },
            })
            .then(function (engineInitializer) {
              return engineInitializer.initializeEngine();
            })
            .then(function (appRunner) {
              appRunner.runApp();
            });
        } catch (error) {
          console.log(error);
        }
      };
    </script>
  </body>
</html>
